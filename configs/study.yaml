# Pre-registered study configuration. Hashed into every run.json.
# Changing a value here after prereg-v1 requires a new prereg tag.

seed: 0

reader:
  model: gpt-6-luna
  reasoning_effort: none      # verified live: effort none accepts temperature 0
  temperature: 0
  max_output_tokens: 512
  cache_ttl: 30m
  # Arm A uses one explicit cache breakpoint after the history when a history is queried at
  # least twice. Arms B and C use explicit mode with no breakpoint, so they pay the plain
  # input rate and never a cache-write surcharge.

judge:
  model: gpt-5-nano           # the sole grader; no second grader, no human grading
  reasoning_effort: minimal   # lowest effort the model accepts
  max_output_tokens: 256

tokenizer:
  encoding: o200k_base        # proxy; the API's usage.input_tokens is authoritative
  safety_margin: 0.05

# Arms B and C place retrieved context in the prompt under one shared token budget.
# 7,000 matches the mean tokens Mem0 reports per query (6,956 on LoCoMo, 6,787 on LongMemEval).
retrieval:
  token_budget: 7000
  candidate_pool: 200         # candidates fetched per query, then filled to the budget in rank order

arms:
  A: {name: full_context}
  B:
    name: mem0
    version: 2.2.1
    threshold: 0.1            # library default
    rerank: false             # library default
    turns_per_add: 10
    extraction_model: gpt-5-mini         # default of the pinned version, recorded
    embedding_model: text-embedding-3-small   # default of the pinned version, recorded
    document_chunk_tokens: 4096   # MemoryAgentBench: one chunk per add call
  C:
    name: rag
    chunk_tokens: 256
    embedding_model: text-embedding-3-small   # same embedder as Mem0

pilot:
  locomo_questions: 30
  locomo_conversations: 3     # bounds Mem0 ingestion cost
  longmemeval_questions: 20
  judge_flip_per_arm: 50      # 50 from arm A and 50 from arm B
