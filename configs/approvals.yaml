# Approval gates. The CLI refuses a paid command until the matching gate is true.
# Only the study owner edits this file; an agent never flips a gate on its own.

# G1: arms B and D embed text with text-embedding-3-small, a model other than GPT-6 Luna and
# GPT-5 nano, and arm B extracts facts with Mem0's default gpt-5-mini. Approve to allow.
g1_extra_models: false

# G2: arm C sends the benchmark conversations to the hosted Supermemory service and incurs its
# usage charges (see configs/prices.yaml). Approve to allow.
g2_supermemory: false

stage_pilot: false
stage_chat_locomo: false
stage_chat_longmemeval: false
