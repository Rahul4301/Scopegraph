[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memstudy"
version = "0.1.0"
description = "Pre-registered study: does a model need an external memory layer when the whole history fits in context?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Suthar" }]
dependencies = [
  "mem0ai[nlp]==2.2.1",
  "numpy>=1.26",
  "openai>=3.23,<4",
  "pyarrow>=18",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8",
  "types-pyyaml>=6.0,<7",
]
coding = ["swebench"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["memstudy*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["memstudy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*", "spacy", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
