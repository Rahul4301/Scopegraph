[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scopegraph"
version = "0.1.0"
description = "Scope-aware and human-correctable graph memory for long-horizon LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Suthar" }]
dependencies = [
  "editdistance>=0.8,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nltk>=3.9,<4",
  "neo4j>=5.26,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyarrow>=18,<22",
  "pyyaml>=6,<7",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: requires a running Neo4j instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scopegraph"]
mypy_path = "src"
